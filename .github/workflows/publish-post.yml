name: 確認した投稿をThreadsに公開

on:
  workflow_dispatch:
    inputs:
      post_text:
        description: 確認して公開する投稿文を入力
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 入力された投稿文をThreadsに公開
        run: python main.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          POST_TEXT: ${{ inputs.post_text }}
