name: 毎日Threadsに投稿

on:
  schedule:
    # 19:00 JST (10:00 UTC)
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Threadsに投稿
        run: python main.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
