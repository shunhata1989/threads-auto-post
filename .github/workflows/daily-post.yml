name: Threadsを自動投稿

on:
  schedule:
    # 19:00〜00:00 JSTの間、毎時確認。遅延した実行の再試行と未投稿分の回収に対応
    - cron: "0 10-15 * * *"
    # 2027年1月1日の新年投稿を12:00 JST（03:00 UTC）に確認
    - cron: "0 3 1 1 *"
  workflow_dispatch:

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿文と写真をThreadsに公開
        run: python scheduled_post.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
