name: 毎日のThreads投稿案

on:
  schedule:
    # 月・火・木・金の19:00 JST（10:00 UTC）に投稿案だけ作成
    - cron: "0 10 * * 1,2,4,5"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 今日の投稿案を作成
        run: python draft_post.py
