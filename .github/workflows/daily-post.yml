name: Threadsを自動投稿

on:
  schedule:
    # 日・月・火・木・金の19:00 JST（10:00 UTC）に写真付きで自動投稿
    - cron: "0 10 * * 0,1,2,4,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿文と写真をThreadsに公開
        run: python scheduled_post.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
